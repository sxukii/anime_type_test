<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>당신의 애니 유형은?</title>

    <link rel="stylesheet" href="style.css">

    <!-- 링크 공유 미리보기 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="애니 유형 테스트">
    <meta property="og:description" content="신춘자가 봐주는 나의 애니 유형 테스트 🔮">
    <meta property="og:image" content="https://sxukii.github.io/anime_type_test/images/thumbnail_2.png">
    <meta property="og:url" content="https://sxukii.github.io/anime_type_test/">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="애니 유형 테스트">
    <meta name="twitter:description" content="신춘자가 봐주는 나의 애니 유형 테스트 🔮">
    <meta name="twitter:image" content="https://sxukii.github.io/anime_type_test/images/thumbnail_2.png">
</head>

<body>

<main class="container">

    <!-- =========================
         시작 화면
    ========================== -->
    <section id="start-screen" class="screen active">

        <h1 class="main-title">
            당신의<br>
            애니 유형은?
        </h1>

        <div class="start-image">
            <img src="images/start.png" alt="신춘자 캐릭터">
        </div>

        <div class="start-text">

            <p class="start-description">
                신춘자가 봐주는 당신의 애니사주
            </p>

            <p class="start-sub-description">
                나는 어떤 애니 캐릭터 유형일까?<br>
                나에게 딱 맞는 애니 추천받기
            </p>

        </div>

        <div class="start-arrow">
            ▼
        </div>

        <button id="start-btn" class="main-btn">
            테스트 시작하기
        </button>

    </section>


    <!-- =========================
         질문 화면
    ========================== -->
    <section id="quiz-screen" class="screen">

        <div class="quiz-top">

            <span id="question-number">
                Q1
            </span>

            <span id="progress-text">
                1 / 8
            </span>
            

        </div>


        <div class="progress-bar">
            <div id="progress"></div>
        </div>


        <div class="question-box">

            <h2 id="question">
                질문이 들어갑니다.
            </h2>

        </div>


        <div id="answers" class="answers">
            <!-- JavaScript에서 생성 -->
        </div>

    </section>


    <!-- =========================
         결과 화면
    ========================== -->
    <section id="result-screen" class="screen">

        <!-- 이 영역만 이미지로 저장 -->
        <div id="result-card" class="result-card">

            <!-- 상단 -->
            <div class="result-header">

                <p class="result-top">
                    당신의 애니 유형은
                </p>

            </div>


            <!-- 유형 제목 -->
            <h1 id="result-title" class="result-title">
                뜨거운 주인공형
            </h1>


            <!-- 한줄 문구 -->
            <p id="result-catchphrase" class="result-catchphrase">
                "포기하지 않는 주인공은 못 참지!"
            </p>


            <!-- 설명 -->
            <p id="result-detail" class="result-detail">
                당신은 애니 속 주인공이 성장하고<br>
                한계를 뛰어넘어 결국 해내는 서사에 끌리는 타입!
            </p>

            <div class="result-decoration decoration-fire">
                <img id="result-icon-1" src="" alt="">
            </div>

            <div class="result-decoration decoration-fist">
                <img id="result-icon-2" src="" alt="">
            </div>

            <div class="result-decoration decoration-star">
                <img id="result-icon-3" src="" alt="">
            </div>


            <!-- =========================
                 운명의 애니
            ========================== -->
            <div class="recommend-section">

                <h2>
                    당신의 운명의 애니
                </h2>

                <div id="anime-list" class="anime-list">
                    <!-- JavaScript에서 생성 -->
                </div>

            </div>

        </div>


        <!-- =========================
             결과 버튼
             이미지 저장 영역 바깥
        ========================== -->
        <div class="result-actions">

            <button
                id="save-btn"
                class="main-btn save-btn"
                type="button"
            >
                이미지 저장하기
            </button>

            <button
                id="restart-btn"
                class="main-btn restart-btn"
                type="button"
            >
                다시 테스트하기
            </button>

        </div>

    </section>

</main>


<!-- 이미지 저장 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
